name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.8"
            cc: clang
          - os: ubuntu-latest
            python: "3.12"
            cc: gcc
          - os: ubuntu-latest
            python: "3.14"
            cc: clang
          - os: macos-latest
            python: "3.14"
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify native compiler
        run: $CC --version

      - name: Install (with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check nox tests scripts

      - name: Test
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Native regressions with UndefinedBehaviorSanitizer
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        env:
          NOX_TEST_SANITIZERS: "1"
          UBSAN_OPTIONS: "symbolize=0"
        run: |
          python -m unittest discover -s tests -p 'test_runtime.py'
          python -m unittest discover -s tests -p 'test_native_values.py'
          python -m unittest discover -s tests -p 'test_json_native.py'
          python -m unittest discover -s tests -p 'test_mcp_native.py'

  distributions:
    uses: ./.github/workflows/release.yml

  mcp-client:
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compiler and official MCP SDK
        run: python -m pip install -e ".[dev,mcp-test]"
      - name: Verify the native MCP server with the official client
        run: python scripts/check_mcp_sdk.py
